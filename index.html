<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>page index</title>
</head>

<body>
    <h1 class="p-3 font-bold">My Store</h1>
    <div><input type="text" id="recherche" placeholder="Search products..."
            class="border w-[70%] max-[500px]:w-[90%] h-[40px] rounded-full pl-2 ml-5.5"></div>
    <form id="filter" class="flex flex-wrap justify-around m-4.5 max-[500px]:justify-start ">
        <div class="flex flex-wrap max-[500px]:mb-2.5">
            <label class="mt-2.5 mr-2.5">Category</label>
            <select id="category" class="border  w-[200px] h-[40px] rounded-full pl-2 ">
                <option value="">..</option>
                <option value="">..</option>
                <option value="">..</option>
                <option value="">..</option>
            </select>
        </div>
        <div>
            <label>Max price</label>
            <input placeholder="0.00" class="border rounded-full pl-2 h-[40px]">
        </div>
        <div class="mt-2.5">
            <input type="radio">
            <label>In stock only</label>
        </div>
    </form>
    <h2 class="p-3 font-bold">Products</h2>
    <section id="catalog" class="flex flex-wrap gap-6.5 ml-10">
        <article class="w-[30%] max-[500px]:w-[90%] bg-gray-100 p-4 rounded-[5%] gap">
            <div>
                <img src="image/imgtest.PNG" class="rounded-[5%] ">
                <h2 class="font-bold">Headphones</h2>
                <p class="text-xs">Wireless headphones</p>
                <h3 class="text-xl font-bold">$59.99</h3>
                <span class="bg-green-200 text-green-700 pl-2 pr-2 rounded-full">In stock</span>
            </div>
        </article>
        <article class="w-[30%] max-[500px]:w-[90%] bg-gray-100 p-4 rounded-[5%] ">
            <div>
                <img src="image/img2test.PNG" class="rounded-[5%]">
                <h2 class="font-bold">Smartwatch</h2>
                <p class="text-xs">Smart watch</p>
                <h3 class="text-xl font-bold">$89.99</h3>
                <span class="bg-green-200 text-green-700 pl-2 pr-2 rounded-full">In stock</span>
            </div>
        </article>
        <article class="w-[30%] max-[500px]:w-[90%] bg-gray-100 p-4 rounded-[5%]">
            <img src="image/img2test.PNG" class="rounded-[5%]">
            <div>
                <h2 class="font-bold">Smartwatch</h2>
                <p class="text-xs">Smart watch</p>
                <h3 class="text-xl font-bold">$89.99</h3>
                <span class="bg-green-200 text-green-700 pl-2 pr-2 rounded-full">In stock</span>
            </div>
        </article>


    </section>
    

</body>
 
</html>
